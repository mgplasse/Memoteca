<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style-memoteca.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
        <header>
    <section id="container-header">
        <div class="box1 header-left">
            <div class="box1">
                <img src="image-icons/Logo/Logo.png" alt="Logo-nuvem">
            </div> 
            <div class="box2">
                <h1 id="thin">Trechos de músicas, citações de livros e</h1>
                
                <h1 id="fatter">suas melhores ideias num só lugar!</h1>
                <!-- cor: --baby-blue letra: poppins -->
            </div>
        </div>            
        <div class="box3 header-right">
            <img src="image-icons/Imagens/Imagem banner.png" alt="Imagem laptop">
            <!-- <a href="image-icons/Imagens/Imagem banner.png"></a> -->
            <!-- tamanho maximo 50% section -->
        </div>
        </section>
       </header>
    <main>
        <section class="container-main">
            <div class="text-pensamento">
                <h1>Adicione um pensamento novo:</h1>
            </div>
            <div>                
                <button class="button-pensamento">Adicionar pensamentos</button>
            </div>
            <div class="mural">
                <h1>Meu Mural</h1>
            </div>
            <div class="conteudo-pensamentos">
                <p>Nada por aqui ainda, que tal compartilhar alguma ideia?</p>
                <img src="image-icons/Imagens/Icone vazio.png" alt="Caixinha vazia">
            </div>
        </section>
        <img src="image-icons/Imagens/Colagem1.png" alt="Left Disco" class="left-disco">
        <img src="image-icons/Imagens/Colagem 2 .png" alt="Right Disco" class="right-disco">
        <img src="image-icons/Imagens/Colagem 3.png" alt="TV" class="TV">
        <img src="image-icons/Imagens/Colagem 4.png" alt="Open Book" class="openbook">
    </main>
    <footer>
        <p>© 2024 Desenvolvido por Alura. Projeto fictício sem fins comerciais.</p>
    </footer>
</body>
</html>
